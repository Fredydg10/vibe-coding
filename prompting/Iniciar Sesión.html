<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iniciar Sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #121212;
    --surface: #181818;
    --text: #f2f2f2;
    --muted: #a3a3a3;
    --accent: #f59e0b;        /* títulos y bordes del contenedor */
    --accent-strong: #b45309; /* botón: texto blanco = 5.0:1 */
    --accent-hover: #92400e;
    --field-border: #6b6b6b;
    --field-bg: #1f1f1f;
    --focus: #fbbf24;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Kalam", "Segoe Print", "Comic Sans MS", cursive, sans-serif;
    font-size: 1.125rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    gap: 20px;
  }

  h1 {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 400;
    color: var(--accent);
    letter-spacing: .02em;
  }

  .card {
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border: 2px solid var(--accent);
    border-radius: 32px;
    padding: 56px 32px;
  }

  form {
    display: grid;
    gap: 20px;
    justify-items: center;
  }

  .field {
    display: grid;
    grid-template-columns: minmax(max-content, 1fr) 220px;
    align-items: center;
    gap: 10px;
    width: 100%;
    max-width: 380px;
  }
  .field label {
    text-align: right;
    color: var(--text);
    cursor: pointer;
  }

  input {
    width: 100%;
    height: 48px;
    padding: 0 14px;
    font: inherit;
    font-size: 1rem;
    color: var(--text);
    background: var(--field-bg);
    border: 2px solid var(--field-border);
    border-radius: 14px;
    transition: border-color .15s, background-color .15s, box-shadow .15s;
  }
  input:hover {
    border-color: var(--muted);
    background: #262626;
  }
  input:focus {
    outline: none;
    border-color: var(--focus);
    box-shadow: 0 0 0 4px rgba(251, 191, 36, .3);
  }

  button {
    margin-top: 12px;
    min-width: 150px;
    height: 48px;
    padding: 0 28px;
    font: inherit;
    font-weight: 700;
    color: #fff;
    background: var(--accent-strong);
    border: 2px solid var(--text);
    border-radius: 12px;
    cursor: pointer;
    transition: background-color .15s, transform .1s, box-shadow .15s;
  }
  button:hover { background: var(--accent-hover); }
  button:active { transform: translateY(1px); }
  button:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--focus);
  }

  /* Móvil: etiqueta encima del campo */
  @media (max-width: 520px) {
    .card { padding: 40px 20px; border-radius: 24px; }
    .field { grid-template-columns: 1fr; gap: 6px; }
    .field label { text-align: left; }
    button { width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <h1>Iniciar Sesión</h1>

  <main class="card">
    <form action="#" method="post">
      <div class="field">
        <label for="gmail">Gmail:</label>
        <input id="gmail" name="gmail" type="email" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="password">Contraseña:</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>

      <button type="submit">Iniciar</button>
    </form>
  </main>
</body>
</html>
