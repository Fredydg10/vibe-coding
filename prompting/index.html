<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Notas</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #f4f5f7; margin: 0; padding: 2rem; color: #222; }
  .container { max-width: 640px; margin: 0 auto; background: #fff; padding: 1.5rem; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  h1, h2 { margin-top: 0; }
  input, textarea { width: 100%; padding: .6rem; font: inherit; border: 1px solid #ccc; border-radius: 6px; margin-bottom: .6rem; }
  textarea { min-height: 120px; resize: vertical; }
  button { padding: .5rem 1rem; font: inherit; border: none; border-radius: 6px; cursor: pointer; }
  #guardar { background: #2563eb; color: #fff; }
  #guardar:hover { background: #1d4ed8; }
  ul { list-style: none; padding: 0; }
  li { display: flex; justify-content: space-between; gap: 1rem; padding: .75rem; border: 1px solid #eee; border-radius: 6px; margin-bottom: .5rem; }
  li strong { display: block; margin-bottom: .25rem; }
  li p { margin: 0; white-space: pre-wrap; color: #555; }
  .eliminar { background: #ef4444; color: #fff; align-self: flex-start; }
  .eliminar:hover { background: #dc2626; }
  .vacio { color: #888; font-style: italic; }
</style>
</head>
<body>
<div class="container">
  <h1>Mis Notas</h1>

  <input id="titulo" type="text" placeholder="Título de la nota">
  <textarea id="texto" placeholder="Escribe tu nota aquí..."></textarea>
  <button id="guardar">Guardar</button>

  <h2 style="margin-top:1.5rem">Notas guardadas</h2>
  <input id="buscar" type="search" placeholder="Buscar por título...">
  <ul id="lista"></ul>
</div>

<script>
  const CLAVE = 'notas';
  const titulo = document.getElementById('titulo');
  const texto = document.getElementById('texto');
  const buscar = document.getElementById('buscar');
  const lista = document.getElementById('lista');

  const cargarNotas = () => JSON.parse(localStorage.getItem(CLAVE)) || [];
  const guardarNotas = notas => localStorage.setItem(CLAVE, JSON.stringify(notas));

  function mostrarNotas() {
    const filtro = buscar.value.trim().toLowerCase();
    const notas = cargarNotas().filter(n => n.titulo.toLowerCase().includes(filtro));
    lista.innerHTML = '';

    if (notas.length === 0) {
      lista.innerHTML = '<li class="vacio">No hay notas.</li>';
      return;
    }

    notas.forEach(nota => {
      const li = document.createElement('li');
      const contenido = document.createElement('div');
      const h = document.createElement('strong');
      const p = document.createElement('p');
      h.textContent = nota.titulo;
      p.textContent = nota.texto;
      contenido.append(h, p);

      const btn = document.createElement('button');
      btn.textContent = 'Eliminar';
      btn.className = 'eliminar';
      btn.onclick = () => {
        guardarNotas(cargarNotas().filter(n => n.id !== nota.id));
        mostrarNotas();
      };

      li.append(contenido, btn);
      lista.appendChild(li);
    });
  }

  document.getElementById('guardar').onclick = () => {
    const t = texto.value.trim();
    if (!t) return alert('Escribe algo antes de guardar.');
    const notas = cargarNotas();
    notas.push({ id: Date.now(), titulo: titulo.value.trim() || 'Sin título', texto: t });
    guardarNotas(notas);
    titulo.value = '';
    texto.value = '';
    mostrarNotas();
  };

  buscar.addEventListener('input', mostrarNotas);
  mostrarNotas();
</script>
</body>
</html>
